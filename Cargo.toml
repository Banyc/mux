[package]
name = "mux"
version = "0.1.0"
edition = "2024"

[dependencies]
primitive = { git = "https://github.com/Banyc/primitive.git", tag = "v0.0.59" }
getrandom = "0.4"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"

[dev-dependencies]
async_smux = "0.3"
clap = { version = "4", features = ["derive"] }
file_transfer = { git = "https://github.com/Banyc/file_transfer.git", tag = "v0.0.7" }
tokio = { version = "1", features = ["full", "test-util"] }

[features]
nightly = []

[lints.clippy]
# Structural concurrency: every spawned task must be owned by a
# `JoinSet` held by a long-lived owner (e.g. `SpliceRouter`, a mux
# session, or the owning writer). The owner reaps children and its drop
# is the abort backstop. Detached `tokio::spawn`/`Handle::spawn` escape
# that ownership, so they are disallowed in production code.
disallowed-methods = [
    { path = "tokio::spawn", reason = "spawned work must be owned by a JoinSet held by a long-lived owner; detached tasks escape supervision and are aborted only by the runtime" },
    { path = "tokio::task::spawn", reason = "spawned work must be owned by a JoinSet held by a long-lived owner; detached tasks escape supervision and are aborted only by the runtime" },
    { path = "tokio::runtime::Handle::spawn", reason = "Handle::spawn is detached with no owner to reap or abort the task; submit the work to an owned JoinSet instead" },
]

[profile.profiling]
debug = true
inherits = "release"
