disallowed-methods = [
    { path = "tokio::spawn", reason = "spawned work must be owned by a JoinSet held by a long-lived owner (e.g. a ResponseRouterDriver or a session) so drop aborts children and panics are observed; no detached tasks" },
    { path = "tokio::task::spawn", reason = "spawned work must be owned by a JoinSet held by a long-lived owner (e.g. a ResponseRouterDriver or a session) so drop aborts children and panics are observed; no detached tasks" },
    { path = "tokio::runtime::Handle::spawn", reason = "Handle::spawn is detached with no owner to reap or abort the task; submit the work to an owned JoinSet instead" },
    { path = "tokio::sync::mpsc::unbounded_channel", reason = "use a named bounded mpsc capacity" },
    { path = "tokio::sync::mpsc::Sender::blocking_send", reason = "do not block runtime synchronization" },
]

disallowed-types = [
    { path = "tokio::sync::mpsc::UnboundedSender", reason = "use bounded mpsc::Sender" },
    { path = "tokio::sync::mpsc::UnboundedReceiver", reason = "use bounded mpsc::Receiver" },
    { path = "tokio::sync::Semaphore", reason = "use atomic/RAII admission plus watch or Notify" },
]
