disallowed-methods = [
    { path = "tokio::spawn", reason = "spawned work must be owned by a JoinSet held by a long-lived owner (e.g. SpliceRouter or a session) so drop aborts children and panics are observed; no detached tasks" },
    { path = "tokio::task::spawn", reason = "spawned work must be owned by a JoinSet held by a long-lived owner (e.g. SpliceRouter or a session) so drop aborts children and panics are observed; no detached tasks" },
    { path = "tokio::runtime::Handle::spawn", reason = "Handle::spawn is detached with no owner to reap or abort the task; submit the work to an owned JoinSet instead" },
]
